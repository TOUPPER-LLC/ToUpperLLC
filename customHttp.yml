# Amplify Hosting custom headers (https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html).
# Headers set in the Amplify console (Hosting > Custom headers and cache) take precedence over this file.
# The Content-Security-Policy allows only what the site uses: its own files, Google Tag Manager /
# Google Analytics, and the contact form's Lambda Function URL. Built-in GA4 tags in GTM work under
# it; GTM "Custom HTML" tags and anything loading other third-party scripts would be blocked.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://www.googletagmanager.com https://*.googletagmanager.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com;
          font-src 'self';
          connect-src 'self' https://*.lambda-url.us-east-1.on.aws https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;
          frame-src https://www.googletagmanager.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none';
          upgrade-insecure-requests

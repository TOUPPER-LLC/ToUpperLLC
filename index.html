<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Default page metadata. The pre-render step (scripts/prerender.mjs) swaps this block for
         each page's own tags, and src/main.tsx removes it once React renders the page's tags. -->
    <!--seo-->
    <title data-static-head>Custom Software &amp; Web Development in Tampa | ToUpper LLC</title>
    <meta
      data-static-head
      name="description"
      content="Tampa software company building websites, web apps, cloud systems and AI automation for businesses across the U.S. Free first consultation."
    />
    <!--/seo-->
    <!-- Business details for search engines. Keep the services in step with src/content/services.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://toupperllc.com/#business",
        "name": "ToUpper LLC",
        "url": "https://toupperllc.com/",
        "logo": "https://toupperllc.com/logo512.png",
        "image": "https://toupperllc.com/og-image.png",
        "description": "Software company based in Tampa, Florida, building websites, web apps, cloud systems, data pipelines and AI automation for businesses across the U.S.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Tampa",
          "addressRegion": "FL",
          "addressCountry": "US"
        },
        "areaServed": [
          {
            "@type": "Place",
            "name": "Tampa Bay area"
          },
          {
            "@type": "Country",
            "name": "United States"
          }
        ],
        "knowsLanguage": [
          "en",
          "es"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Software development services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Web and mobile applications",
                "description": "Websites, customer portals and internal tools, built to last."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Cloud and DevOps",
                "description": "Reliable hosting on AWS, Google Cloud, Azure or Oracle Cloud with automated releases."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Data engineering and reporting",
                "description": "Pipelines and dashboards that turn scattered records into decisions."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "AI tooling and automation",
                "description": "Practical AI and automation that take repetitive work off your plate."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Modernization and migration",
                "description": "Upgrade aging systems and cut cloud costs without downtime."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Support and maintenance",
                "description": "Monitoring, patching and on-call help after launch."
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
